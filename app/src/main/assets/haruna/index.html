<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080b18">
  <title>Haruna</title>
  <link rel="icon" href="haruna-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">H<span>✦</span></div>
        <div><h1>Haruna</h1><small>IA local no seu dispositivo</small></div>
      </div>
      <button id="model" class="model-button" type="button" aria-label="Selecionar modelo GGUF">Modelo</button>
    </header>

    <div class="status-row">
      <span class="status-dot"></span><span id="brain">Modo básico</span>
      <span class="privacy">Local • Privada</span>
    </div>

    <section id="messages" class="messages" aria-live="polite">
      <div class="msg assistant"><div class="avatar">H</div><div class="bubble">Olá! Eu sou a Haruna. ✦<br><span class="muted">Funciono localmente no seu dispositivo. Carregue um modelo GGUF para ativar minha IA.</span></div></div>
    </section>

    <form id="composer" class="composer">
      <textarea id="input" rows="1" maxlength="12000" placeholder="Digite sua mensagem..." aria-label="Mensagem"></textarea>
      <button type="submit" class="send" aria-label="Enviar mensagem">➤</button>
    </form>
    <div class="footer-note">Haruna • processamento local e offline</div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
