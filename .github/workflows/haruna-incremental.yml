name: Haruna complete hybrid state and optional Vulkan
on:
  push:
    branches: [build/haruna-incremental]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
env:
  LLAMA_CPP_REVISION: 4d71b42fd87db24b8b7c808c151b713aa4459cfd
jobs:
  retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Retire only superseded incremental build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          actual=$(gh api repos/doutor56-lab/Haruna/actions/runs/41235761626 --jq '.head_sha')
          state=$(gh api repos/doutor56-lab/Haruna/actions/runs/41235761626 --jq '.status')
          if [ "$actual" = "e8973e655663e4f4f18225b839ff1ab562d9fb62" ] && [ "$state" != "completed" ]; then
            gh api --method POST repos/doutor56-lab/Haruna/actions/runs/41235761626/cancel
          fi
  build:
    needs: retire
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        flavor: [cpu, vulkan]
    env:
      HARUNA_FLAVOR: ${{ matrix.flavor }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 3f363ad0f82e01d9582efb25bc9fdda6e2c652cb
          submodules: recursive
          fetch-depth: 1
      - name: Verify narrow scope and pinned context runtime
        run: |
          echo "HARUNA_SOURCE_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git fetch --depth=1 origin be5f3d353e0a877b69d55f93567195f6c60eabd7
          git -C third_party/llama.cpp fetch --depth=1 origin "$LLAMA_CPP_REVISION"
          git -C third_party/llama.cpp checkout --detach "$LLAMA_CPP_REVISION"
          python3 scripts/check_incremental_scope.py
          python3 scripts/patch_android_loader.py
          python3 scripts/check_diag45_binding.py
          python3 scripts/check_decision_probes.py
          python3 scripts/check_diag45.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Focused voice and existing streaming RAG checks
        run: |
          mkdir -p stage6-tests
          set -o pipefail
          g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined scripts/check_context_profile.cpp -o /tmp/context-profile
          ASAN_OPTIONS=detect_leaks=0 /tmp/context-profile | tee stage6-tests/context-profile.txt
          g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined -Ithird_party/llama.cpp/vendor scripts/check_context_runtime.cpp -o /tmp/context-runtime
          ASAN_OPTIONS=detect_leaks=0 /tmp/context-runtime | tee stage6-tests/context-runtime.txt
          g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined scripts/check_incremental_state.cpp -o /tmp/inc-state
          ASAN_OPTIONS=detect_leaks=0 /tmp/inc-state | tee stage6-tests/incremental-state.txt
          node scripts/check_incremental_messages.mjs | tee stage6-tests/incremental-messages.txt
          node scripts/check_lab.mjs | tee stage6-tests/lab-js.txt
          node scripts/check_voice.mjs | tee stage6-tests/voice-js.txt
          node scripts/check_streaming.mjs | tee stage6-tests/streaming-js.txt
          node scripts/check_prefix_rag.mjs | tee stage6-tests/rag-fastpath.txt
          g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined scripts/check_prefix_cache.cpp -o /tmp/prefix-check
          ASAN_OPTIONS=detect_leaks=0 /tmp/prefix-check | tee stage6-tests/prefix-native.txt
      - name: Real native tiny random hybrid state equivalence, NOT device performance
        run: |
          cmake -S third_party/llama.cpp -B /tmp/inc-host -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_BACKEND_DL=OFF -DGGML_CPU_ALL_VARIANTS=OFF -DGGML_CPU_KLEIDIAI=OFF -DGGML_CPU_REPACK=OFF -DLLAMA_BUILD_TESTS=ON -DLLAMA_BUILD_SERVER=OFF -DLLAMA_OPENSSL=OFF
          cmake --build /tmp/inc-host --target test-llama-archs -j4
          mkdir -p /tmp/inc-fixtures
          /tmp/inc-host/bin/test-llama-archs -a qwen35 -s 424242 -d .02 -o /tmp/inc-fixtures > stage6-tests/fixture-creation.txt 2>&1
          g++ -std=c++17 -Ithird_party/llama.cpp/include -Ithird_party/llama.cpp/ggml/include scripts/check_incremental_native.cpp -L/tmp/inc-host/bin -Wl,-rpath,/tmp/inc-host/bin -lllama -lggml -lggml-base -o /tmp/inc-real
          /tmp/inc-real /tmp/inc-fixtures/qwen35-dense.gguf > stage6-tests/real-hybrid-equivalence.txt 2>&1
          tail -5 stage6-tests/real-hybrid-equivalence.txt
      - name: Browser flow with fake bridges and offline network
        run: |
          npm install --prefix /tmp/haruna-stage6-browser --cache /tmp/haruna-stage6-npm-cache --ignore-scripts --no-audit --no-fund playwright@1.56.1
          set -o pipefail
          HARUNA_CHROME="$(command -v google-chrome || command -v chromium)" HARUNA_PLAYWRIGHT_PACKAGE=/tmp/haruna-stage6-browser/package.json node scripts/check_voice_browser.mjs | tee stage6-tests/voice-browser.txt
          HARUNA_CHROME="$(command -v google-chrome || command -v chromium)" node scripts/check_lab_browser.mjs | tee stage6-tests/lab-browser.txt
          HARUNA_CHROME="$(command -v google-chrome || command -v chromium)" node scripts/check_incremental_browser.mjs | tee stage6-tests/incremental-browser.txt
          HARUNA_CHROME="$(command -v google-chrome || command -v chromium)" node scripts/check_context_browser.mjs | tee stage6-tests/context-browser.txt
          HARUNA_CHROME="$(command -v google-chrome || command -v chromium)" node scripts/check_system_prompt_browser.mjs | tee stage6-tests/system-browser.txt
          HARUNA_CHROME="$(command -v google-chrome || command -v chromium)" node scripts/check_dbg_ui.mjs | tee stage6-tests/dbg-ui-browser.txt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Existing Android toolchain
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Optional Vulkan build tools, isolated headers only
        if: matrix.flavor == 'vulkan'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y glslc libvulkan-dev spirv-headers
          mkdir -p "$GITHUB_WORKSPACE/vulkan-headers/include"
          cp -r /usr/include/vulkan /usr/include/vk_video /usr/include/spirv "$GITHUB_WORKSPACE/vulkan-headers/include/"
          echo "HARUNA_VULKAN_HEADERS=$GITHUB_WORKSPACE/vulkan-headers" >> "$GITHUB_ENV"
      - name: Compile Android Kotlin before full native build
        run: gradle :app:compileDebugKotlin -PharunaVulkan=${{ matrix.flavor == 'vulkan' }} --stacktrace --no-daemon
      - name: Pure Kotlin voice queue and existing streaming checks
        run: |
          set -o pipefail
          python3 scripts/check_system_prompt.py | tee stage6-tests/system-kotlin.txt
          python3 scripts/check_voice.py | tee stage6-tests/voice-kotlin.txt
          python3 scripts/check_stream_delivery.py | tee stage6-tests/streaming-kotlin.txt
      - name: Build full normal APK and compile diagnostic instrumentation
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest -PharunaVulkan=${{ matrix.flavor == 'vulkan' }} --stacktrace --no-daemon
      - name: Check actual Whisper JNI symbol isolation
        run: python3 scripts/check_stt_native.py
      - name: Verify APK and package technical evidence
        run: python3 scripts/package_incremental.py
      - name: Publish installer only
        uses: actions/upload-artifact@v4
        with:
          name: Haruna-incremental-${{ matrix.flavor }}-APK
          path: incremental-install/*.apk
          if-no-files-found: error
      - name: Publish technical report, checksums and evidence
        uses: actions/upload-artifact@v4
        with:
          name: HARUNA_INCREMENTAL_${{ matrix.flavor }}_TECNICO
          path: incremental-technical/
          if-no-files-found: error
      - name: Preserve failed check evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HARUNA_INCREMENTAL_${{ matrix.flavor }}_FAILED
          path: |
            stage6-tests/
            stage6-browser/
            dbg-ui-browser/
          if-no-files-found: ignore
