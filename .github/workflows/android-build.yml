name: Android build

on:
  push:
    branches: [main, recovery/haruna-82d3c47, luna/silero-vad, feature/nezumi-model-compat, feature/safetensors-sd15]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.head_ref || github.ref_name }}-${{ github.event_name == 'pull_request' && github.head_ref == 'feature/safetensors-sd15' && 'skip' || 'build' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LLAMA_CPP_REVISION: 4d71b42fd87db24b8b7c808c151b713aa4459cfd

jobs:
  build:
    # This experimental branch builds on push only; avoid charging a duplicate PR build.
    if: github.event_name != 'pull_request' || github.head_ref != 'feature/safetensors-sd15'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Haruna and llama.cpp
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Verify pinned llama.cpp Android runtime
        run: |
          test "$(git -C third_party/llama.cpp rev-parse HEAD)" = "$LLAMA_CPP_REVISION"
          echo "HARUNA_SOURCE_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Using llama.cpp $(git -C third_party/llama.cpp rev-parse HEAD)"

      - name: Patch Android loader diagnostics
        run: python3 scripts/patch_android_loader.py

      - name: Verify llama.cpp Android binding
        run: |
          test "$(git -C third_party/llama.cpp rev-parse HEAD)" = "$LLAMA_CPP_REVISION"
          test -f third_party/llama.cpp/examples/llama.android/lib/build.gradle.kts
          test -f third_party/llama.cpp/examples/llama.android/lib/src/main/java/com/arm/aichat/InferenceEngine.kt
          test -f third_party/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp
          grep -Fq 'lastLoadError' third_party/llama.cpp/examples/llama.android/lib/src/main/java/com/arm/aichat/internal/InferenceEngineImpl.kt
          grep -Fq 'g_last_load_error' third_party/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp

      - name: Guard Haruna app sources
        run: |
          grep -Fq 'Haruna' app/src/main/assets/haruna/index.html
          grep -Fq 'haruna-icon.svg' app/src/main/assets/haruna/index.html
          grep -Fq "import llm from './llm-engine.js'" app/src/main/assets/haruna/app.js
          grep -Fq 'WebViewAssetLoader' app/src/main/java/com/proxyslabs/haruna/MainActivity.kt
          grep -Fq 'appassets.androidplatform.net/assets/haruna/index.html' app/src/main/java/com/proxyslabs/haruna/MainActivity.kt
          grep -Fq 'HarunaAndroid' app/src/main/java/com/proxyslabs/haruna/MainActivity.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install native Android toolchain
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Clean stale Android outputs
        run: gradle clean --no-daemon

      - name: Compile Kotlin and validate Silero capture
        run: |
          gradle :app:compileDebugKotlin --stacktrace --no-daemon
          python3 scripts/check_silero.py

      - name: Test image package installation
        run: |
          python3 tests/image_controller_check.py
          c++ -std=c++17 -O1 -pthread -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" -Iapp/build/safetensors-native/_deps/sd_cpp-src/include -Iapp/build/safetensors-native/_deps/sd_cpp-src/thirdparty tests/safetensors_native_check.cpp -o /tmp/safetensors-native-check
          /tmp/safetensors-native-check
          gradle :app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify packaged Haruna UI
        shell: python
        run: |
          import hashlib, zipfile
          apk='app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as z:
              names=set(z.namelist())
              assert 'lib/arm64-v8a/libharuna_image.so' in names
              assert 'lib/arm64-v8a/libharuna_nezumi_engine.so' in names
              assert 'lib/arm64-v8a/libharuna_nezumi_image.so' in names
              assert 'lib/arm64-v8a/libharuna_sd_safetensors.so' in names
              assert 'assets/licenses/safetensors/stable-diffusion.cpp-MIT.txt' in names
              import subprocess, pathlib
              lib=pathlib.Path(z.extract('lib/arm64-v8a/libharuna_sd_safetensors.so','apk-audit'))
              deps=subprocess.check_output(['readelf','-d',str(lib)],text=True)
              assert 'libggml' not in deps and 'vulkan' not in deps.lower() and 'OpenCL' not in deps
              print('Safetensors private CPU library dependencies verified')
              assert 'assets/licenses/nezumi/GPL-3.0.txt' in names
              assert not any(n.endswith('/libMNN.so') for n in names)
              assert not any(n.endswith('/libggml-vulkan.so') for n in names)
              import hashlib
              print('Image APK SHA-256:', hashlib.sha256(open(apk,'rb').read()).hexdigest())
              required={
                  'assets/haruna/index.html',
                  'assets/haruna/style.css',
                  'assets/haruna/app.js',
                  'assets/haruna/image-chat.js',
                  'assets/haruna/image-chat.css',
                  'assets/haruna/image-models.js',
                  'assets/haruna/llm-engine.js',
                  'assets/haruna/android-bridge.js',
                  'assets/haruna/haruna-icon.svg',
                  'assets/silero_vad.int8.onnx',
                  'lib/arm64-v8a/libsherpa-onnx-jni.so',
                  'lib/arm64-v8a/libharuna_whisper_stt.so',
              }
              missing=required - names
              if missing:
                  raise SystemExit(f'Missing Haruna assets in APK: {sorted(missing)}')
              assert hashlib.sha256(z.read('assets/silero_vad.int8.onnx')).hexdigest() == 'c36d490aff5ab924ca6c7aeec4d8f6bd3d22db6fa17611b9c5b17eae58ac3a20', 'Silero asset checksum mismatch'
              html=z.read('assets/haruna/index.html').decode('utf-8')
              js=z.read('assets/haruna/app.js').decode('utf-8')
              assert 'Haruna' in html
              assert "import llm from './llm-engine.js'" in js
          print('Verified: APK contains the current Haruna UI and bridge assets.')

      - name: Name image installation APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Haruna-Multimotor-Controles-ARM64-debug.apk

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Haruna-Multimotor-Controles-ARM64-APK
          path: app/build/outputs/apk/debug/Haruna-Multimotor-Controles-ARM64-debug.apk
          if-no-files-found: error



      # Corresponding LGPL source travels with the binary, including the pinned
      # statically embedded Apache MNN source and all replacement/build scripts.
      - name: Package corresponding image engine sources
        if: success()
        run: |
          mkdir -p image-source
          cp -a app/src/main/cpp/image image-source/
          cp -a app/src/main/cpp/safetensors image-source/
          cp docs/SAFETENSORS_SD15_ANDROID_INTEGRATION.md docs/ANDROID_MULTIMOTOR.md docs/IMAGE_CONTROLS_ANDROID.md image-source/
          cp -a docs/IMAGE_ENGINE_NEZUMI_INTEGRATION.md image-source/
          cp app/build.gradle.kts image-source/
          MNN_SOURCE=$(python3 -c 'from pathlib import Path; paths=[line.split("=",1)[1] for p in Path("app").rglob("CMakeCache.txt") for line in p.read_text().splitlines() if line.startswith("MNN_SOURCE_DIR:STATIC=")]; print(next((str(Path(p).resolve()) for p in paths if (Path(p)/"CMakeLists.txt").is_file()),""))')
          test -f "$MNN_SOURCE/CMakeLists.txt"
          cp -a "$MNN_SOURCE" image-source/MNN
          git rev-parse HEAD > image-source/HARUNA_COMMIT.txt
          sha256sum app/build/outputs/apk/debug/Haruna-Multimotor-Controles-ARM64-debug.apk > image-source/APK_SHA256.txt
          tar -czf HARUNA_NEZUMI_CORRESPONDING_SOURCE.tar.gz image-source

      - name: Upload source and technical report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Haruna-SD15-Safetensors-Source-and-Report
          path: |
            HARUNA_NEZUMI_CORRESPONDING_SOURCE.tar.gz
            docs/IMAGE_ENGINE_NEZUMI_INTEGRATION.md
            docs/SAFETENSORS_SD15_ANDROID_INTEGRATION.md
            docs/ANDROID_MULTIMOTOR.md
            docs/IMAGE_CONTROLS_ANDROID.md
            docs/evidence/nezumi/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: error
