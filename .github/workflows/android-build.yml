name: Android build

on:
  push:
    branches: [main, recovery/haruna-82d3c47]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LLAMA_CPP_REVISION: 7894e8b92481a8bb8ffe94f73b656ffe0dd01e10

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Haruna and llama.cpp
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Update llama.cpp Android runtime
        run: |
          git -C third_party/llama.cpp fetch --depth=1 origin "$LLAMA_CPP_REVISION"
          git -C third_party/llama.cpp checkout --detach "$LLAMA_CPP_REVISION"
          echo "Using llama.cpp $(git -C third_party/llama.cpp rev-parse HEAD)"

      - name: Patch Android loader diagnostics
        run: python3 scripts/patch_android_loader.py

      - name: Verify llama.cpp Android binding
        run: |
          test "$(git -C third_party/llama.cpp rev-parse HEAD)" = "$LLAMA_CPP_REVISION"
          test -f third_party/llama.cpp/examples/llama.android/lib/build.gradle.kts
          test -f third_party/llama.cpp/examples/llama.android/lib/src/main/java/com/arm/aichat/InferenceEngine.kt
          test -f third_party/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp
          grep -Fq 'lastLoadError' third_party/llama.cpp/examples/llama.android/lib/src/main/java/com/arm/aichat/internal/InferenceEngineImpl.kt
          grep -Fq 'g_last_load_error' third_party/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp

      - name: Guard Haruna app sources
        run: |
          grep -Fq 'Haruna' app/src/main/assets/haruna/index.html
          grep -Fq 'haruna-icon.svg' app/src/main/assets/haruna/index.html
          grep -Fq "import llm from './llm-engine.js'" app/src/main/assets/haruna/app.js
          grep -Fq 'WebViewAssetLoader' app/src/main/java/com/proxyslabs/haruna/MainActivity.kt
          grep -Fq 'appassets.androidplatform.net/assets/haruna/index.html' app/src/main/java/com/proxyslabs/haruna/MainActivity.kt
          grep -Fq 'HarunaAndroid' app/src/main/java/com/proxyslabs/haruna/MainActivity.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install native Android toolchain
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Install Vulkan shader build tools (experimental GPU PR only)
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/vulkan-native-backend'
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc libvulkan-dev spirv-tools spirv-headers
          command -v glslc
          NDK_VULKAN="$ANDROID_HOME/ndk/29.0.13113456/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/vulkan"
          test -f "$NDK_VULKAN/vulkan.h"
          test -f /usr/include/vulkan/vulkan.hpp
          # NDK has Vulkan C headers; stage missing Vulkan-Hpp headers in ephemeral CI.
          sudo cp -n /usr/include/vulkan/*.hpp "$NDK_VULKAN/"
          test -f "$NDK_VULKAN/vulkan.hpp"
          # SPIRV-Headers is installed on the host, while Android clang
          # searches the NDK target sysroot. Stage the target-independent headers.
          test -f /usr/include/spirv/unified1/spirv.hpp
          NDK_INCLUDE="$ANDROID_HOME/ndk/29.0.13113456/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include"
          sudo cp -a /usr/include/spirv "$NDK_INCLUDE/"
          test -f "$NDK_INCLUDE/spirv/unified1/spirv.hpp"

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Clean stale Android outputs
        run: gradle clean --no-daemon

      - name: Build debug APK
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.head_ref }}" == "fix/vulkan-native-backend" ]]; then
            export HARUNA_VULKAN_INCLUDE_DIR="$ANDROID_HOME/ndk/29.0.13113456/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include"
            gradle :app:assembleDebug -PharunaVulkan=true --stacktrace --no-daemon
          else
            gradle :app:assembleDebug --stacktrace --no-daemon
          fi

      - name: Verify Vulkan native library (experimental GPU PR only)
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/vulkan-native-backend'
        shell: python
        run: |
          import zipfile
          apk='app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as z:
              vulkan=[n for n in z.namelist() if n.endswith('/libggml-vulkan.so')]
              if not vulkan:
                  raise SystemExit('GPU APK missing libggml-vulkan.so')
              print('Vulkan backend packaged:', vulkan)

      - name: Verify packaged Haruna UI
        shell: python
        run: |
          import zipfile
          apk='app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as z:
              names=set(z.namelist())
              required={
                  'assets/haruna/index.html',
                  'assets/haruna/style.css',
                  'assets/haruna/app.js',
                  'assets/haruna/llm-engine.js',
                  'assets/haruna/android-bridge.js',
                  'assets/haruna/haruna-icon.svg',
              }
              missing=required-names
              if missing:
                  raise SystemExit(f'Missing Haruna assets in APK: {sorted(missing)}')
              html=z.read('assets/haruna/index.html').decode('utf-8')
              js=z.read('assets/haruna/app.js').decode('utf-8')
              assert 'Haruna' in html
              assert "import llm from './llm-engine.js'" in js
          print('Verified: APK contains the current Haruna UI and bridge assets.')

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/vulkan-native-backend' && 'haruna-vulkan-experimental-apk' || 'haruna-debug-apk' }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
