name: Android build

on:
  push:
    branches: [build/apk-runtime-baseline-78fb284]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LLAMA_CPP_REVISION: 7894e8b92481a8bb8ffe94f73b656ffe0dd01e10

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Haruna and llama.cpp
        uses: actions/checkout@v6
        with:
          ref: 78fb2846e68b689ad66c696fc1391599bc55825f
          submodules: recursive
          fetch-depth: 1

      - name: Update llama.cpp Android runtime
        run: |
          git -C third_party/llama.cpp fetch --depth=1 origin "$LLAMA_CPP_REVISION"
          git -C third_party/llama.cpp checkout --detach "$LLAMA_CPP_REVISION"
          echo "Using llama.cpp $(git -C third_party/llama.cpp rev-parse HEAD)"

      - name: Patch Android loader diagnostics
        run: python3 scripts/patch_android_loader.py

      - name: Verify llama.cpp Android binding
        run: |
          test "$(git -C third_party/llama.cpp rev-parse HEAD)" = "$LLAMA_CPP_REVISION"
          test -f third_party/llama.cpp/examples/llama.android/lib/build.gradle.kts
          test -f third_party/llama.cpp/examples/llama.android/lib/src/main/java/com/arm/aichat/InferenceEngine.kt
          test -f third_party/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp
          grep -Fq 'lastLoadError' third_party/llama.cpp/examples/llama.android/lib/src/main/java/com/arm/aichat/internal/InferenceEngineImpl.kt
          grep -Fq 'g_last_load_error' third_party/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp
          grep -Fq 'sendChatMessages' third_party/llama.cpp/examples/llama.android/lib/src/main/java/com/arm/aichat/InferenceEngine.kt
          grep -Fq 'haruna_input_tokens' third_party/llama.cpp/examples/llama.android/lib/src/main/cpp/haruna_chat.h
          grep -Fq 'sendChatMessages' app/src/main/java/com/proxyslabs/haruna/LlamaCppBackend.kt

      - name: Guard Haruna app sources
        run: |
          grep -Fq 'Haruna' app/src/main/assets/haruna/index.html
          grep -Fq 'haruna-icon.svg' app/src/main/assets/haruna/index.html
          grep -Fq "import llm from './llm-engine.js'" app/src/main/assets/haruna/app.js
          grep -Fq 'WebViewAssetLoader' app/src/main/java/com/proxyslabs/haruna/MainActivity.kt
          grep -Fq 'appassets.androidplatform.net/assets/haruna/index.html' app/src/main/java/com/proxyslabs/haruna/MainActivity.kt
          grep -Fq 'HarunaAndroid' app/src/main/java/com/proxyslabs/haruna/MainActivity.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install native Android toolchain
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Clean stale Android outputs
        run: gradle clean --no-daemon

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify packaged Haruna UI
        shell: python
        run: |
          import zipfile
          apk='app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as z:
              names=set(z.namelist())
              required={
                  'assets/haruna/diagnostics/inference.js',
                  'assets/haruna/diagnostics/runtime-report.js',
                  'assets/haruna/index.html',
                  'assets/haruna/style.css',
                  'assets/haruna/app.js',
                  'assets/haruna/llm-engine.js',
                  'assets/haruna/android-bridge.js',
                  'assets/haruna/haruna-icon.svg',
                  'assets/haruna/essential/store.js',
                  'assets/haruna/essential/first-contact.js',
                  'assets/haruna/essential/capture-policy.js',
                  'assets/haruna/essential/ui.js',
                  'assets/haruna/retrieval/enrich.js',
                  'assets/haruna/retrieval/policy.js',
                  'assets/haruna/retrieval/indicator.js',
                  'assets/haruna/diagnostics/panel.js',
                  'assets/haruna/identity/direct-replies.js',
                  'assets/haruna/context/messages.js',
                  'assets/haruna/learned/schema.js',
                  'assets/haruna/learned/privacy.js',
                  'assets/haruna/learned/capture.js',
                  'assets/haruna/learned/store.js',
                  'assets/haruna/learned/context.js',
                  'assets/haruna/learned/dataset.js',
                  'assets/haruna/learned/behavior-profile.js',
                  'assets/haruna/learned/ui.js',
                  'assets/haruna/learned/ui.css',
                  'assets/haruna/voice-chat.js',
                  'assets/haruna/speech-ui.js',
              }
              missing=required-names
              if missing:
                  raise SystemExit(f'Missing Haruna assets in APK: {sorted(missing)}')
              html=z.read('assets/haruna/index.html').decode('utf-8')
              js=z.read('assets/haruna/app.js').decode('utf-8')
              assert 'Haruna' in html
              assert "import llm from './llm-engine.js'" in js
          print('Verified: APK contains the current Haruna UI and bridge assets.')

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: haruna-78fb284-runtime-baseline-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
