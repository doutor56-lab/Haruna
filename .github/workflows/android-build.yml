name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LLAMA_CPP_REVISION: 7894e8b92481a8bb8ffe94f73b656ffe0dd01e10

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Haruna and llama.cpp
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Update llama.cpp Android runtime
        run: |
          git -C third_party/llama.cpp fetch --depth=1 origin "$LLAMA_CPP_REVISION"
          git -C third_party/llama.cpp checkout --detach "$LLAMA_CPP_REVISION"
          echo "Using llama.cpp $(git -C third_party/llama.cpp rev-parse HEAD)"

      - name: Verify llama.cpp Android binding
        run: |
          test "$(git -C third_party/llama.cpp rev-parse HEAD)" = "$LLAMA_CPP_REVISION"
          test -f third_party/llama.cpp/examples/llama.android/lib/build.gradle.kts
          test -f third_party/llama.cpp/examples/llama.android/lib/src/main/java/com/arm/aichat/InferenceEngine.kt
          test -f third_party/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install native Android toolchain
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: haruna-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
