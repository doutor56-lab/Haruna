name: Haruna Android debug build

on:
  push:
    branches:
      - refactor/haruna-ui-integracao-20261108
      - design/haruna-paginas-aprovadas-20261108
  workflow_dispatch:
  workflow_call:
    inputs:
      artifact_name:
        type: string
        required: false
        default: Haruna-Android-ARM64

jobs:
  build-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout including llama.cpp
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate shared UI and structured image intent
        run: |
          python3 scripts/validate_ui_integrity.py
          node tests/image_intent_check.mjs
          node tests/voice_orb_check.cjs
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Apply Haruna llama.cpp runtime extensions
        run: python3 scripts/patch_android_loader.py
      - name: Verify llama.cpp runtime API compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          interface = Path("third_party/llama.cpp/examples/llama.android/lib/src/main/java/com/arm/aichat/InferenceEngine.kt")
          backend = Path("app/src/main/java/com/proxyslabs/haruna/LlamaCppBackend.kt")
          if not interface.is_file():
              raise SystemExit("Missing llama.cpp InferenceEngine.kt: check submodule checkout")
          expected = set(re.findall(r"engine\.([A-Za-z_]\w*)\s*\(", backend.read_text()))
          declared = set(re.findall(r"\bfun\s+([A-Za-z_]\w*)\s*\(", interface.read_text()))
          missing = sorted(expected - declared)
          if missing:
              print("::error title=Incompatible llama.cpp Android API::Haruna requires custom InferenceEngine methods absent from the checked-out llama.cpp submodule: " + ", ".join(missing))
              raise SystemExit(1)
          print("Haruna llama.cpp interface methods are present")
          PY
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -Pandroid.injected.build.abi=arm64-v8a :app:testDebugUnitTest :app:assembleDebug
      - name: Verify separate Overdrive package and launcher name
        if: github.ref_name == 'feature/android-overdrive'
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > /tmp/overdrive-badging.txt
          python3 - <<'PYCODE'
          from pathlib import Path
          s=Path('/tmp/overdrive-badging.txt').read_text()
          assert "package: name='com.proxyslabs.haruna.overdrive'" in s, s[:300]
          assert "application-label:'Haruna Overdrive'" in s
          assert "native-code: 'arm64-v8a'" in s
          print('Verified: separate package, Haruna Overdrive label, ARM64')
          PYCODE
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Haruna-Overdrive-ARM64.apk
      - name: Hash Android APK
        run: sha256sum app/build/outputs/apk/debug/*.apk > app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name || 'Haruna-Android-ARM64' }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
