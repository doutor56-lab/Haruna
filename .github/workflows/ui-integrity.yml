name: Haruna UI integrity

on:
  push:
    branches:
      - refactor/haruna-ui-integracao-20261108
  pull_request:
  workflow_dispatch:

jobs:
  ui-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate WebView assets and UI structure
        run: python3 scripts/validate_ui_integrity.py
